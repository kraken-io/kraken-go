name: ci

on:
  push:
    branches: [master, 'maintenance/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 1.16 is the floor the source actually needs (io.ReadAll). Keep it in
        # the matrix so a change that raises it fails here, not for a user.
        go: ['1.16', '1.18', '1.20', '1.21', '1.22', '1.23', '1.24']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -cover ./...

  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::not gofmt-clean: $out"
            gofmt -d .
            exit 1
          fi
